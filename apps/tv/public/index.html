<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http:; media-src https: http: blob:; connect-src https: http:; object-src 'none'; base-uri 'none'">
  <title>CinneTemple TV</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="stage">
    <div id="app">
      <header><a class="brand" aria-label="CinneTemple"><img src="logo.png" alt=""><span>CINNETEMPLE</span></a><nav id="navigation" aria-label="Main navigation"></nav></header>
      <main id="view" aria-label="CinneTemple catalogue"><div class="loading" role="status">Opening your cinema…</div></main>
      <footer><span>STORIES WORTH THE SCREEN.</span><span id="platform"></span><span>↑ ↓ ← → Navigate &nbsp; OK Select &nbsp; Back Return</span></footer>
    </div>
    <section id="player" aria-label="Video player" hidden></section>
    <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden></div>
    <div id="toast" role="status" hidden></div>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
